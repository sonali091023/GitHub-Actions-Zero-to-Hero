name: deploy Flask app
on: 
    #workflow_dispatch

    workflow_run:  
        workflows: ["docker build & push"]     #Run the deployment workflow whenever the docker build & push workflow finishes.
        types:
            - completed
        branches: 
            - main
jobs:
  deploy:
    env:
      DOCKERHUB_USER: ${{ vars.DOCKERHUB_USER }}
      DOCKER_TAG: ${{ github.sha }}
    
    runs-on: self-hosted
    
    steps:
    - name: checkout code
      uses: actions/checkout@v4 
    
    - name: deploy with docker compose
      run: |
        docker compose down 
        docker-compose up -d --build --force-recreate --pull always