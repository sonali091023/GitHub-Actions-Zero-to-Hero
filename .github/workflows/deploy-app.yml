name: deploy Flask app
on: 
  workflow_dispatch
jobs:
  deploy:
  #env:
      #DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    runs-on: self-hosted
    steps:
      - name: checkout code
        uses: actions/checkout@4

      - name: deploy with docker compose
        run: docker compose down && docker-compose up -d --build --force-recreate