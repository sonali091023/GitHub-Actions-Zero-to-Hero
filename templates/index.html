<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Engineer Interview Roadmap - Interactive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0f172a;
            --secondary: #1e293b;
            --accent: #3b82f6;
            --accent-light: #60a5fa;
            --trending: #f59e0b;
            --success: #10b981;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border: #334155;
            --bg-card: #1a1f35;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, #1a2942 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 41, 59, 0.8) 100%);
            border-bottom: 1px solid var(--border);
            padding: 2rem;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-flex {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
        }

        .header-content h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-content p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .header-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .progress-badge {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent-light);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-light);
            border: 1px solid var(--accent);
        }

        .btn-secondary:hover {
            background: rgba(59, 130, 246, 0.3);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .roadmap-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .category-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .category-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent) 0%, var(--accent-light) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .category-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(59, 130, 246, 0.15);
        }

        .category-card:hover::before {
            opacity: 1;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .category-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .category-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .category-progress {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        .topics-list {
            list-style: none;
        }

        .topic-item {
            padding: 0.75rem 0;
            padding-left: 1.5rem;
            border-bottom: 1px solid rgba(52, 65, 84, 0.5);
            position: relative;
            color: var(--text-secondary);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .topic-item:last-child {
            border-bottom: none;
        }

        .topic-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            border: 2px solid var(--accent);
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .topic-item input[type="checkbox"] {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            width: 16px;
            height: 16px;
            left: 0;
            margin: 0;
        }

        .topic-item input[type="checkbox"]:checked::before {
            content: '✓';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-weight: bold;
            font-size: 0.8rem;
            text-align: center;
            width: 16px;
            height: 16px;
            background: var(--success);
            border: 2px solid var(--success);
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .topic-item input[type="checkbox"]:checked + .topic-content {
            color: var(--success);
            text-decoration: line-through;
            opacity: 0.7;
        }

        .topic-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex: 1;
        }

        .topic-text {
            flex: 1;
        }

        .topic-item.trending .topic-text {
            color: var(--trending);
            font-weight: 500;
        }

        .topic-item.trending {
            background: rgba(245, 158, 11, 0.05);
            margin: 0.5rem -1.5rem;
            padding-left: 1.5rem;
            padding-right: 1rem;
            border-left: 2px solid var(--trending);
        }

        .trending-badge {
            display: inline-block;
            background: var(--trending);
            color: var(--primary);
            font-size: 0.6rem;
            font-weight: 700;
            padding: 0.25rem 0.5rem;
            border-radius: 3px;
            white-space: nowrap;
            margin-left: 0.5rem;
        }

        .btn-learn-more {
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-light);
            border: 1px solid var(--accent);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-learn-more:hover {
            background: rgba(59, 130, 246, 0.3);
            transform: scale(1.05);
        }

        /* Detail View Styles */
        .detail-header {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(59, 130, 246, 0.05) 100%);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .detail-header-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
        }

        .detail-header-content h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .detail-header-content p {
            color: var(--text-secondary);
        }

        .detail-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .detail-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
        }

        .detail-section h2 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: var(--accent-light);
        }

        .detail-section ul {
            list-style: none;
        }

        .detail-section li {
            padding: 0.6rem 0;
            padding-left: 1.5rem;
            color: var(--text-secondary);
            position: relative;
        }

        .detail-section li::before {
            content: '→';
            position: absolute;
            left: 0;
            color: var(--accent);
        }

        .back-btn {
            margin-bottom: 2rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent-light);
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid var(--accent);
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(59, 130, 246, 0.2);
        }

        .trending-section {
            margin-top: 3rem;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1) 0%, rgba(245, 158, 11, 0.05) 100%);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 12px;
            padding: 2rem;
        }

        .trending-section h2 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: var(--trending);
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .trending-topics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .trending-item {
            background: var(--bg-card);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 8px;
            padding: 1.5rem;
        }

        .trending-item h3 {
            font-size: 1.1rem;
            margin-bottom: 0.75rem;
            color: var(--trending);
        }

        .trending-item p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .interview-prep {
            margin-top: 3rem;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(16, 185, 129, 0.05) 100%);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 2rem;
        }

        .interview-prep h2 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: var(--success);
        }

        .interview-questions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .question-card {
            background: var(--bg-card);
            border-left: 3px solid var(--success);
            padding: 1.5rem;
            border-radius: 4px;
        }

        .question-card h3 {
            font-size: 1rem;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        .question-card p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        footer {
            background: var(--secondary);
            border-top: 1px solid var(--border);
            padding: 2rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 3rem;
        }

        @media (max-width: 1024px) {
            .detail-content {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .header-flex {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-controls {
                width: 100%;
                justify-content: space-between;
            }

            .header-content h1 {
                font-size: 1.5rem;
            }

            .roadmap-grid {
                grid-template-columns: 1fr;
            }

            .topic-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .topic-content {
                flex-direction: column;
                align-items: flex-start;
                width: 100%;
            }

            .btn-learn-more {
                width: 100%;
                text-align: center;
            }

            .detail-header {
                flex-direction: column;
                text-align: center;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>

            init() {
                this.loadProgress();
                this.renderMain();
            },

            loadProgress() {
                const saved = localStorage.getItem('devops-roadmap-progress');
                if (saved) {
                    this.checkedItems = JSON.parse(saved);
                } else {
                    this.checkedItems = new Set();
                }
            },

            saveProgress() {
                localStorage.setItem('devops-roadmap-progress', JSON.stringify(Array.from(this.checkedItems)));
                this.updateProgress();
            },

            updateProgress() {
                const totalTopics = this.data.categories.reduce((sum, cat) => sum + cat.topics.length, 0);
                const percentage = Math.round((this.checkedItems.size / totalTopics) * 100);
                document.getElementById('progress-text').textContent = `Progress: ${percentage}%`;
            },

            renderMain() {
                this.renderCategories();
                this.renderTrending();
                this.renderInterview();
                this.updateProgress();
            },

            renderCategories() {
                const grid = document.getElementById('roadmapGrid');
                grid.innerHTML = this.data.categories.map(cat => `
                    <div class="category-card">
                        <div class="category-header">
                            <div class="category-icon">${cat.icon}</div>
                            <div>
                                <h2 class="category-title">${cat.name}</h2>
                                <div class="category-progress" id="progress-${cat.id}"></div>
                            </div>
                        </div>
                        <ul class="topics-list">
                            ${cat.topics.map((topic, idx) => `
                                <li class="topic-item ${topic.trending ? 'trending' : ''}">
                                    <input type="checkbox" 
                                        id="${cat.id}-${idx}" 
                                        ${this.checkedItems.has(`${cat.id}-${idx}`) ? 'checked' : ''}
                                        onchange="app.toggleTopic('${cat.id}-${idx}')">
                                    <div class="topic-content">
                                        <div class="topic-text">
                                            ${topic.name}
                                            ${topic.trending ? '<span class="trending-badge">TRENDING</span>' : ''}
                                        </div>
                                        <button class="btn-learn-more" onclick="app.showDetail('${cat.id}')">
                                            Learn More →
                                        </button>
                                    </div>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `).join('');

                // Update category progress
                this.data.categories.forEach(cat => {
                    const checked = cat.topics.filter((_, idx) => 
                        this.checkedItems.has(`${cat.id}-${idx}`)
                    ).length;
                    const percentage = Math.round((checked / cat.topics.length) * 100);
                    const elem = document.getElementById(`progress-${cat.id}`);
                    if (elem) {
                        elem.textContent = `${checked}/${cat.topics.length} completed (${percentage}%)`;
                    }
                });
            },

            renderTrending() {
                const section = document.getElementById('trendingSection');
                section.innerHTML = `
                    <h2>🔥 Booming Topics & Future-Ready Skills</h2>
                    <div class="trending-topics">
                        ${this.data.trendingTopics.map(topic => `
                            <div class="trending-item">
                                <h3>${topic.name}</h3>
                                <p>${topic.desc}</p>
                            </div>
                        `).join('')}
                    </div>
                `;
            },

            renderInterview() {
                const section = document.getElementById('interviewSection');
                section.innerHTML = `
                    <h2>Interview Preparation Guide</h2>
                    <div class="interview-questions">
                        ${this.data.interviewQuestions.map(q => `
                            <div class="question-card">
                                <h3>${q.title}</h3>
                                <p>${q.desc}</p>
                            </div>
                        `).join('')}
                    </div>
                `;
            },

            toggleTopic(id) {
                if (this.checkedItems.has(id)) {
                    this.checkedItems.delete(id);
                } else {
                    this.checkedItems.add(id);
                }
                this.saveProgress();
            },

            showDetail(categoryId) {
                const category = this.data.categories.find(c => c.id === categoryId);
                if (!category) return;

                const content = `
                    <div class="detail-header">
                        <div class="detail-header-icon">${category.icon}</div>
                        <div class="detail-header-content">
                            <h1>${category.name}</h1>
                            <p>${category.description}</p>
                        </div>
                    </div>

                    <div class="detail-content">
                        <div class="detail-section">
                            <h2>Overview</h2>
                            <p>${category.details.overview}</p>
                        </div>

                        <div class="detail-section">
                            <h2>Key Topics</h2>
                            <ul>
                                ${category.details.keyTopics.map(t => `<li>${t}</li>`).join('')}
                            </ul>
                        </div>

                        <div class="detail-section">
                            <h2>Essential Skills</h2>
                            <ul>
                                ${category.details.skills.map(s => `<li>${s}</li>`).join('')}
                            </ul>
                        </div>

                        <div class="detail-section">
                            <h2>Learning Resources</h2>
                            <ul>
                                ${category.details.resources.map(r => `<li>${r}</li>`).join('')}
                            </ul>
                        </div>
                    </div>

                    <div class="detail-section" style="grid-column: 1 / -1;">
                        <h2>Interview Tips</h2>
                        <ul style="columns: 2; column-gap: 2rem;">
                            ${category.details.interviewTips.map(t => `<li>${t}</li>`).join('')}
                        </ul>
                    </div>

                    <div style="margin-top: 2rem; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); padding: 1.5rem; border-radius: 8px;">
                        <h3 style="color: var(--success); margin-bottom: 1rem;">Study Checklist</h3>
                        <ul class="topics-list">
                            ${category.topics.map((topic, idx) => `
                                <li class="topic-item">
                                    <input type="checkbox" 
                                        id="detail-${category.id}-${idx}" 
                                        ${this.checkedItems.has(`${category.id}-${idx}`) ? 'checked' : ''}
                                        onchange="app.toggleTopic('${category.id}-${idx}')">
                                    <div class="topic-content">
                                        <div class="topic-text">
                                            ${topic.name}
                                            ${topic.trending ? '<span class="trending-badge">TRENDING</span>' : ''}
                                        </div>
                                    </div>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;

                document.getElementById('detailContent').innerHTML = content;
                this.switchView('detailView');
            },

            switchView(viewId) {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.getElementById(viewId).classList.add('active');
                window.scrollTo(0, 0);
            },

            backToMain() {
                this.switchView('mainView');
                this.renderMain();
            },

            resetProgress() {
                if (confirm('Are you sure you want to reset all progress? This cannot be undone.')) {
                    this.checkedItems.clear();
                    this.saveProgress();
                    this.renderMain();
                }
            }
        };

        // Initialize app on load
        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
